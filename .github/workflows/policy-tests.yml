name: Controller policy tests
on:
  push:
  pull_request:
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile controller and policy tests
        run: python -m py_compile src/controller.py src/selftest.py
      - name: Run battery SOC policy tests (no hardware)
        run: python src/selftest.py
      - name: Validate staged Storm Mode and administrator code (no hardware)
        run: |
          python -m py_compile src/operator_policy.py src/operator_portal.py src/storm_watch.py src/charge_learning.py src/storm_latch.py src/charge_monitor.py src/operator_cycle.py src/nws_client.py src/pi_storm_supervisor.py
          python -m unittest discover -s tests -p 'test_operator_policy.py' -v
          python -m unittest discover -s tests -p 'test_storm_watch.py' -v
          python -m unittest discover -s tests -p 'test_charge_learning.py' -v
          python -m unittest discover -s tests -p 'test_charge_monitor.py' -v
          python -m unittest discover -s tests -p 'test_operator_cycle.py' -v
          python -m unittest discover -s tests -p 'test_nws_client.py' -v
          python -m unittest discover -s tests -p 'test_pi_storm_supervisor.py' -v
          python -m unittest discover -s tests -p 'test_storm_latch.py' -v
          python -m unittest discover -s tests -p 'test_operator_portal.py' -v
