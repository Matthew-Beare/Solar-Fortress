d real front-panel mirror.\n   LED classes own the rendered colour; SVG presentation attributes do not. */\n.hero{container-type:inline-size}\n.energy-map{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-areas:\"pv grid\" \"bus inverter\" \"battery load\";align-items:center;gap:34px 42px;max-width:760px;margin:15px auto 8px;padding:12px}\n.flow-connections{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}\n.energy-node{position:relative;z-index:1;min-width:0;border:1px solid #365b72;border-radius:13px;background:linear-gradient(145deg,#142f43,#0d2335);padding:16px 18px;box-shadow:0 7px 18px #0002}\n.energy-pv{grid-area:pv}.energy-grid{grid-area:grid}.energy-bus{grid-area:bus}.energy-inverter{grid-area:inverter}.energy-battery{grid-area:battery}.energy-load{grid-area:load}\n.energy-source{min-height:107px}.energy-title{display:flex;align-items:center;gap:7px;font-size:10px;font-weight:760;letter-spacing:.09em;color:#a9c7da}.energy-title svg{width:20px;height:20px;flex:none}\n.energy-value{display:block;margin-top:9px;font-size:29px;line-height:1.1;letter-spacing:-.04em;font-weight:800;color:#e4f3ff;white-space:nowrap}.energy-sub{display:block;margin-top:7px;font-size:10px;line-height:1.4;color:#8aafc5}.energy-pv .energy-value{color:#f6c56a}.energy-load .energy-value{color:#6dc8ff}\n.energy-bus{min-height:116px}.energy-bus .energy-value{font-size:28px}.energy-battery{min-height:134px}.energy-battery .energy-value{color:var(--soc-indicator)}\n.energy-battery-row{display:flex;align-items:center;gap:12px}.energy-battery-data{min-width:0}.energy-battery .energy-value{font-size:30px}.energy-battery-watts{display:block;color:#a2cdbf;font-size:13px;font-weight:650;margin-top:5px}\n.battery-symbol{position:relative;flex:0 0 35px;height:65px;border:2px solid #78b9ad;border-radius:6px;background:#0b1d29;padding:4px}.battery-symbol:before{content:\"\";position:absolute;left:9px;right:9px;top:-7px;height:5px;background:#78b9ad;border-radius:2px}.battery-symbol-inner{position:relative;height:100%;overflow:hidden;border-radius:2px;background:#203e45}.battery-symbol-fill{position:absolute;bottom:0;left:0;width:100%;height:0;background:var(--soc-indicator);transition:height .5s,background .4s}\n.battery-state{display:inline-block;font-size:10px;font-weight:780;letter-spacing:.05em;color:var(--battery-state-color,#b2c4d1);border:1px solid currentColor;border-radius:5px;padding:5px 7px;margin-top:12px}\n.energy-inverter{padding:0;background:transparent;border:0;box-shadow:none}\n.multiplus-cabinet{position:relative;isolation:isolate;max-width:320px;margin:auto;padding:14px 12px 12px;overflow:hidden;border-radius:7px 7px 5px 5px;border:1px solid #64b4e7;border-top:3px solid #b5e5ff;background:linear-gradient(100deg,#07538e 0%,#0d74b9 12%,#117dc1 50%,#0966a7 91%,#06497e 100%);box-shadow:inset 6px 0 0 #003b6266,inset -6px 0 0 #003b6266,0 10px 22px #0004}\n.multiplus-brand{color:#f4fbff;font-size:14px;font-weight:800;letter-spacing:-.03em;margin:0 2px 12px}.multiplus-brand small{display:block;font-size:6px;font-weight:650;letter-spacing:.22em;margin-top:1px;color:#bfe7ff}\n.multiplus-front{position:relative;background:linear-gradient(135deg,#202d37,#111d27);border:1px solid #6c8798;border-radius:4px;padding:10px 8px 9px;box-shadow:inset 0 1px 2px #0009}\n.front-led-columns{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.12fr);gap:7px}.front-led-heading{font-size:9px;color:#b4c7d4;font-weight:750;line-height:1.2;margin-bottom:6px;letter-spacing:.02em}\n.front-led-row{display:flex;align-items:center;gap:6px;min-height:22px;white-space:nowrap}.front-led-name{font-size:10px;line-height:1.25;color:#eef5f9;font-weight:520}\n.physical-led{display:inline-block;flex:0 0 8px;width:8px;height:8px;border-radius:50%;border:1px solid #4b5c69;background-color:#18232d;color:var(--led-color,#9aa9b4);opacity:1;filter:none}\n.physical-led[data-led-state=\"1\"],.physical-led[data-led-state=\"2\"],.physical-led[data-led-state=\"3\"]{background-color:var(--led-color);border-color:var(--led-color);box-shadow:0 0 3px var(--led-color),0 0 9px color-mix(in srgb,var(--led-color) 55%,transparent)}\n.physical-led[data-led-state=\"unknown\"]{background:repeating-linear-gradient(135deg,#6d7d89 0 2px,#243744 2px 4px);border-color:#8597a5;box-shadow:none}\n@keyframes physicalLedBlink{0%,49.999%{opacity:1}50%,100%{opacity:.12}}\n.physical-led[data-led-state=\"2\"],.physical-led[data-led-state=\"3\"]{animation:physicalLedBlink 1s linear infinite}\n.physical-led[data-led-state=\"3\"]{animation-delay:-.5s}\n.multiplus-model{color:#f1f8fd;font-size:17px;line-height:1.1;letter-spacing:-.025em;font-weight:780;margin:14px 2px 2px}.multiplus-model small{display:block;font-size:7px;letter-spacing:.13em;font-weight:600;margin-top:5px;color:#bee2f7}\n.multiplus-stripe{position:absolute;right:-13px;bottom:13px;width:58px;height:7px;transform:rotate(-45deg);background:#f59c32;box-shadow:0 3px 0 #0b5d96}\n.inverter-observed{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0 0;text-align:center}.actual-mode{font-size:13px;line-height:1.3;font-weight:800;letter-spacing:.04em;color:#e4f4ff}\n.front-led-legend{font-size:8px;color:#91adbf;line-height:1.4;text-align:center;margin-top:7px}\n@container(max-width:560px){.energy-map{grid-template-areas:\"pv grid\" \"bus battery\" \"inverter inverter\" \"load load\";gap:34px 20px;padding:12px 18px;margin-top:9px}.energy-node{padding:13px 12px}.energy-source{min-height:105px}.energy-title{font-size:9px;letter-spacing:.04em;gap:5px}.energy-title svg{width:16px;height:16px}.energy-value{font-size:25px}.energy-bus{min-height:134px}.energy-bus .energy-value{font-size:23px}.energy-sub{font-size:9px}.energy-battery-row{gap:7px}.battery-symbol{flex-basis:23px;width:23px;height:49px;padding:3px}.battery-symbol:before{left:5px;right:5px}.energy-battery .energy-value{font-size:24px}.energy-battery-watts{font-size:11px}.battery-state{font-size:8px;padding:4px}.energy-inverter{padding:0}.multiplus-cabinet{max-width:285px;padding:17px 16px 15px}.multiplus-brand{font-size:18px}.front-led-name{font-size:12px}.front-led-heading{font-size:10px}.front-led-row{min-height:25px;gap:8px}.physical-led{flex-basis:9px;width:9px;height:9px}.multiplus-model{font-size:22px}.energy-load{min-height:93px}.energy-load .energy-value{font-size:28px}.inverter-observed{padding-top:10px}.actual-mode{font-size:16px}}\n@media(max-width:360px){.energy-battery .battery-symbol{display:none}}\n@media(prefers-reduced-motion:reduce){.physical-led[data-led-state=\"2\"],.physical-led[data-led-state=\"3\"]{animation:none;outline:1px dashed #dcefff;outline-offset:2px}}\n\n<\/style><\/head>\n<body><div class=\"app\" id=\"application\">\n<aside class=\"sidebar\"><div class=\"brand\">\n<svg class=\"crest\" viewBox=\"0 0 48 56\" aria-hidden=\"true\"><path d=\"M5 13L14 17V7L23 11V2L32 11V7L42 13V53H5z\" fill=\"#f4bf60\"/><path d=\"M10 24h7v-6h7v6h6v-6h7v27H10z\" fill=\"#a96d2e\"/><path d=\"M22 37a5 5 0 0 1 10 0v16H22z\" fill=\"#17263a\"/><path d=\"M1 52h46v3H1z\" fill=\"#ffd992\"/><\/svg>\n<div><div class=\"brandtitle\">SOLAR<br><span>FORTRESS<\/span><\/div><div class=\"brandsub\">ENERGY COMMAND<\/div><\/div><\/div>\n<p class=\"sidecap\">CONTROL ROOM<\/p>\n<nav class=\"nav\" aria-label=\"Dashboard views\">\n<button data-view=\"overview\" class=\"active\" aria-pressed=\"true\"><span class=\"ico\">\u2302<\/span><span class=\"name\">Overview<\/span><\/button>\n<button data-view=\"analytics\" aria-pressed=\"false\"><span class=\"ico\">\u25a4<\/span><span class=\"name\">Live Analytics<\/span><\/button>\n<button data-view=\"systems\" aria-pressed=\"false\"><span class=\"ico\">\u2699<\/span><span class=\"name\">System Health<\/span><\/button>\n<\/nav>\n<div class=\"side-bottom\"><div class=\"site-line\">BOOMER HQ / 37663 / TN<\/div><div class=\"side-health\"><span class=\"seeddot\"><\/span><span id=\"sideStatus\">Awaiting telemetry<\/span><\/div>\n<\/div>\n<\/aside>\n<main class=\"main\"><div class=\"topbar\"><div><div class=\"eyebrow\">37663 \u2022 Tennessee / Mission Control<\/div><div id=\"viewTitle\" class=\"top-title\">Energy Command Center<\/div><\/div>\n<div class=\"top-utilities\"><span id=\"systemPill\" class=\"pill amber\"><span class=\"seeddot\"><\/span><span id=\"systemPillText\">CONNECTING<\/span><\/span>\n<div class=\"clock\"><small id=\"dateDisplay\">--<\/small><strong id=\"timeDisplay\">--:--<\/strong><\/div><\/div><\/div>\n<div class=\"actions\"><div class=\"status-left\"><span class=\"chip\"><span id=\"controlDot\" class=\"dot\"><\/span>Controller <strong id=\"controllerRunning\">UNKNOWN<\/strong><\/span><span class=\"chip\"><span id=\"victronDot\" class=\"dot\"><\/span>Victron <strong id=\"victronState\">UNKNOWN<\/strong><\/span><span class=\"chip demo-warning\">DEMO DATA \u2022 NOT HARDWARE<\/span><\/div><div class=\"subnav\"><span class=\"small-label\" id=\"lastUpdated\">WAITING FOR DATA<\/span><button class=\"btn-outline\" id=\"motionToggle\">\u2161 Pause motion<\/button><\/div><\/div>\n<section class=\"view active\" id=\"overview\"><div class=\"sectionhead\" style=\"margin-top:5px\"><div><h2>Electrical command overview<\/h2><\/div><\/div>\n<div class=\"cards\">\n<article class=\"card gauge-card battery-card\" style=\"--accent:var(--teal)\">\n <div class=\"over\">BATTERY STATE OF CHARGE<\/div><div class=\"big\" id=\"socTop\">--%<\/div>\n <div class=\"desc\"><span id=\"batteryTrend\">\u25e6<\/span><span id=\"batteryDesc\">Waiting for readings<\/span><\/div>\n <svg class=\"instrument battery-instrument\" viewBox=\"0 0 120 78\" role=\"img\" aria-label=\"Battery state of charge gauge\">\n <defs><clipPath id=\"socInstrumentClip\"><rect x=\"12\" y=\"13\" width=\"90\" height=\"48\" rx=\"6\"/><\/clipPath><linearGradient id=\"socInstrumentGrad\" x1=\"0\" x2=\"1\"><stop stop-color=\"#1b9a89\"/><stop offset=\"1\" stop-color=\"#62f5be\"/><\/linearGradient><\/defs>\n <rect x=\"4\" y=\"4\" width=\"106\" height=\"65\" rx=\"11\" fill=\"#0b2433\" stroke=\"#598e9b\" stroke-width=\"2.7\"/>\n <rect x=\"110\" y=\"23\" width=\"8\" height=\"27\" rx=\"2.8\" fill=\"#598e9b\"/>\n <rect x=\"12\" y=\"13\" width=\"90\" height=\"48\" rx=\"6\" fill=\"#183246\"/>\n <g clip-path=\"url(#socInstrumentClip)\"><rect class=\"battery-meter-fill\" id=\"socGaugeFill\" x=\"12\" y=\"13\" width=\"0\" height=\"48\" rx=\"2\" fill=\"url(#socInstrumentGrad)\"/><\/g>\n <path d=\"M34 14V59M56 14V59M78 14V59\" stroke=\"#8cb5b7\" stroke-width=\"1\" opacity=\".36\"/>\n\n <\/svg><\/article>\n<article class=\"card gauge-card solar-card\" style=\"--accent:var(--yellow)\">\n<div class=\"over\">SOLAR PRODUCTION<\/div><div class=\"big\" id=\"solarTop\">-- W<\/div><div class=\"desc\" id=\"solarCaption\">Waiting for charge controllers<\/div>\n<svg class=\"instrument solar-instrument\" viewBox=\"0 0 140 94\" role=\"img\" aria-label=\"Solar power speedometer with automatic scale\">\n<path d=\"M18 77 A52 52 0 0 1 122 77\" class=\"gauge-bg\"/>\n<path id=\"solarGaugeArc\" d=\"M18 77 A52 52 0 0 1 122 77\" class=\"gauge-active\" stroke-dasharray=\"0 164\"/>\n<g id=\"solarGaugeNeedle\" class=\"gauge-needle\" transform=\"rotate(-90 70 77)\"><path d=\"M70 77 L70 33\" class=\"gauge-needle\"/><circle cx=\"70\" cy=\"77\" r=\"5\" fill=\"#f6c56a\" stroke=\"#fff2cb\" stroke-width=\"1.2\"/><\/g>\n<text x=\"11\" y=\"92\" text-anchor=\"start\">0<\/text><text id=\"solarGaugeMax\" x=\"126\" y=\"92\" text-anchor=\"end\">1 kW<\/text>\n<text x=\"70\" y=\"88\" text-anchor=\"middle\" style=\"font-size:8px;fill:#7299ae\">AUTO SCALE<\/text>\n<\/svg><\/article>\n<article class=\"card\" style=\"--accent:var(--blue)\"><div class=\"over\">AC OUTPUT / HOUSE LOAD<\/div><div class=\"big\" id=\"loadTop\">-- W<\/div><div class=\"desc\" id=\"loadCaption\">MultiPlus-II output<\/div><\/article>\n<article class=\"card\" style=\"--accent:#d2e6f8\"><div class=\"over\">GRID IMPORT<\/div><div class=\"big\" id=\"gridTop\">-- W<\/div><div class=\"desc\" id=\"gridDesc\">Checking AC input<\/div><\/article>\n<\/div>\n<div class=\"sectionhead\"><div><h2>Live energy distribution<\/h2><\/div><\/div>\n<div class=\"hero-layout\"><div class=\"flow-main\"><section class=\"panel hero\" id=\"flowPanel\">\n<div class=\"headrow\"><div><div class=\"panel-title\">DC / AC Energy Architecture<\/div><div class=\"panel-desc\" id=\"scenarioExplanation\">Waiting for the first live snapshot<\/div><\/div><div class=\"live-bullet\"><span class=\"seeddot\"><\/span><span id=\"freshLabel\">CONNECTING<\/span><\/div><\/div>\n\n<div class=\"energy-map\" id=\"energyMap\" aria-label=\"Live electrical topology\">\n <svg class=\"flow-connections\" aria-hidden=\"true\">\n  <g class=\"mobile-wires\"><path id=\"wirePvMobile\"/><path id=\"wireGridMobile\"/><path id=\"wireDcMobile\"/><path id=\"wireBatteryMobile\"/><path id=\"wireHouseMobile\"/><\/g>\n  <g class=\"stream off mobile-stream\" data-wire=\"pv\" id=\"pathPvMobile\"><path class=\"glowwire\"/><\/g>\n  <g class=\"stream off mobile-stream\" data-wire=\"grid\" id=\"pathGridMobile\"><path class=\"glowwire\"/><\/g>\n  <g class=\"stream off mobile-stream\" data-wire=\"dc\" id=\"pathDcMobile\"><path class=\"glowwire\"/><\/g>\n  <g class=\"stream off mobile-stream\" data-wire=\"battery\" id=\"pathBatteryMobile\"><path class=\"glowwire\"/><\/g>\n  <g class=\"stream off mobile-stream\" data-wire=\"house\" id=\"pathHouseMobile\"><path class=\"glowwire\"/><\/g>\n <\/svg>\n <section class=\"energy-node energy-source energy-pv\" id=\"energyPv\">\n  <div class=\"energy-title\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#f6c56a\" stroke-width=\"1.6\"><circle cx=\"12\" cy=\"12\" r=\"5\"/><path d=\"M12 1v3M12 20v3M1 12h3M20 12h3M4 4l2 2M18 18l2 2M20 4l-2 2M6 18l-2 2\"/><\/svg>SOLAR PV<\/div>\n  <span id=\"mobileSolar\" class=\"energy-value\">-- W<\/span><span class=\"energy-sub\">MPPT OUTPUT<\/span>\n <\/section>\n <section class=\"energy-node energy-source energy-grid\" id=\"energyGrid\">\n  <div class=\"energy-title\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#b9d8ef\" stroke-width=\"1.5\"><path d=\"M12 2L4 22M12 2l8 20M8 12h8M5 20h14M7 7h10M12 2v20\"/><\/svg>GRID<\/div>\n  <span id=\"mobileGrid\" class=\"energy-value\">-- W<\/span><span id=\"mobileGridSourceStatus\" class=\"energy-sub\">AC UNKNOWN<\/span>\n <\/section>\n <section class=\"energy-node energy-bus\" id=\"energyBus\">\n  <div class=\"energy-title\">DC BUSBARS<\/div><span id=\"mobileBusVoltage\" class=\"energy-value\">-- V<\/span><span class=\"energy-sub\">BATTERY VOLTAGE<\/span>\n <\/section>\n <section class=\"energy-node energy-inverter\" id=\"energyInverter\" aria-label=\"MultiPlus-II front panel\">\n  <div class=\"multiplus-cabinet\">\n   <div class=\"multiplus-brand\">victron energy<small>BLUE POWER<\/small><\/div>\n   <div class=\"multiplus-front\"><div class=\"front-led-columns\"><div class=\"front-led-column\"><div class=\"front-led-heading\">charger<\/div><div class=\"front-led-row\"><span id=\"ledMainsMobile\" class=\"physical-led\" data-led-key=\"Mains\" data-led-state=\"unknown\" role=\"img\" aria-label=\"mains on: unknown\"><\/span><span class=\"front-led-name\">mains on<\/span><\/div><div class=\"front-led-row\"><span id=\"ledBulkMobile\" class=\"physical-led\" data-led-key=\"Bulk\" data-led-state=\"unknown\" role=\"img\" aria-label=\"bulk: unknown\"><\/span><span class=\"front-led-name\">bulk<\/span><\/div><div class=\"front-led-row\"><span id=\"ledAbsorptionMobile\" class=\"physical-led\" data-led-key=\"Absorption\" data-led-state=\"unknown\" role=\"img\" aria-label=\"absorption: unknown\"><\/span><span class=\"front-led-name\">absorption<\/span><\/div><div class=\"front-led-row\"><span id=\"ledFloatMobile\" class=\"physical-led\" data-led-key=\"Float\" data-led-state=\"unknown\" role=\"img\" aria-label=\"float: unknown\"><\/span><span class=\"front-led-name\">float<\/span><\/div><\/div><div class=\"front-led-column\"><div class=\"front-led-heading\">inverter<\/div><div class=\"front-led-row\"><span id=\"ledInverterMobile\" class=\"physical-led\" data-led-key=\"Inverter\" data-led-state=\"unknown\" role=\"img\" aria-label=\"inverter on: unknown\"><\/span><span class=\"front-led-name\">inverter on<\/span><\/div><div class=\"front-led-row\"><span id=\"ledOverloadMobile\" class=\"physical-led\" data-led-key=\"Overload\" data-led-state=\"unknown\" role=\"img\" aria-label=\"overload: unknown\"><\/span><span class=\"front-led-name\">overload<\/span><\/div><div class=\"front-led-row\"><span id=\"ledLowBatteryMobile\" class=\"physical-led\" data-led-key=\"LowBattery\" data-led-state=\"unknown\" role=\"img\" aria-label=\"low battery: unknown\"><\/span><span class=\"front-led-name\">low battery<\/span><\/div><div class=\"front-led-row\"><span id=\"ledTemperatureMobile\" class=\"physical-led\" data-led-key=\"Temperature\" data-led-state=\"unknown\" role=\"img\" aria-label=\"temperature: unknown\"><\/span><span class=\"front-led-name\">temperature<\/span><\/div><\/div><\/div><\/div>\n   <div class=\"multiplus-model\">MultiPlus-II<small>INVERTER / CHARGER<\/small><\/div><div class=\"multiplus-stripe\"><\/div>\n  <\/div>\n  <div class=\"inverter-observed\"><span id=\"mobileMode\" class=\"actual-mode\">UNKNOWN<\/span><\/div>\n <\/section>\n <section class=\"energy-node energy-battery\" id=\"energyBattery\">\n  <div class=\"energy-battery-row\"><div class=\"battery-symbol\" aria-hidden=\"true\"><div class=\"battery-symbol-inner\"><div id=\"mobileBatteryFill\" class=\"battery-symbol-fill\"><\/div><\/div><\/div><div class=\"energy-battery-data\"><div class=\"energy-title\">BATTERY<\/div><span id=\"mobileSoc\" class=\"energy-value\">--%<\/span><span id=\"mobileBattery\" class=\"energy-battery-watts\">-- W<\/span><\/div><\/div>\n  <div class=\"battery-state\" id=\"mobileBatteryStateChip\"><span id=\"mobileBatteryState\">UNKNOWN<\/span><\/div>\n <\/section>\n <section class=\"energy-node energy-load\" id=\"energyLoad\">\n  <div class=\"energy-title\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#6dc8ff\" stroke-width=\"1.6\"><path d=\"M2 11L12 2l10 9v11h-7v-9H9v9H2z\"/><\/svg>AC LOADS<\/div><span id=\"mobileLoad\" class=\"energy-value\">-- W<\/span><span class=\"energy-sub\">MULTIPLUS-II OUTPUT<\/span>\n <\/section>\n<\/div>\n<div id=\"offlineOverlay\" class=\"offline-overlay\">TELEMETRY NOT CURRENT<br><small>No active flow inferred<\/small><\/div>\n<div class=\"flow-footer\"><span id=\"latencyLabel\">1s polling \u2022 awaiting data<\/span><\/div>\n<div class=\"maintenance-banner\" id=\"maintenanceBanner\" hidden>\n <div class=\"maint-top\"><span id=\"maintenanceTitle\">Full-charge maintenance<\/span><strong id=\"maintenanceCountdown\">--:--:--<\/strong><\/div>\n <div class=\"maint-progress\"><span id=\"maintenanceProgress\"><\/span><\/div>\n <div class=\"maint-detail\" id=\"maintenanceDetail\">Awaiting controller state<\/div>\n<\/div>\n<\/section>\n<div class=\"flow-chart-area\"><div class=\"sectionhead\"><div><h2>Recent telemetry<\/h2><\/div><button class=\"small-link\" id=\"openAnalytics\">View live analytics<\/button><\/div>\n<div class=\"plots\">\n<section class=\"panel plot\"><div class=\"plot-head\"><div><strong>Solar generation<\/strong><div class=\"plot-val amber\" id=\"plotSolarVal\">-- W<\/div><\/div><span class=\"small-label\" id=\"solarChartPeriod\">TODAY \u00b7 ET<\/span><\/div><div class=\"mini-chart-scroll\"><svg class=\"chart\" viewBox=\"0 0 840 205\"><defs><linearGradient id=\"solarFill\" x1=\"0\" x2=\"0\" y1=\"0\" y2=\"1\"><stop stop-color=\"#eebf4c\" stop-opacity=\".42\"/><stop offset=\"1\" stop-color=\"#eebf4c\" stop-opacity=\"0\"/><\/linearGradient><\/defs><g id=\"solarAxes\" class=\"chart-axes\"><\/g><path id=\"solarArea\" fill=\"url(#solarFill)\"/><path id=\"solarChart\" fill=\"none\" stroke=\"#ffc958\" stroke-width=\"2.4\"/><circle id=\"solarDot\" r=\"4\" fill=\"#ffe493\" opacity=\"0\"/><text id=\"solarEmpty\" class=\"empty-chart\" x=\"185\" y=\"75\">Awaiting samples<\/text><\/svg><\/div><div class=\"plot-footer\"><span id=\"solarStart\">--<\/span><span>LIVE<\/span><\/div><\/section>\n<section class=\"panel plot\"><div class=\"plot-head\"><div><strong>Battery SOC<\/strong><div class=\"plot-val green\" id=\"plotSocVal\">--%<\/div><\/div><span class=\"small-label\">TODAY \u00b7 ET<\/span><\/div><div class=\"mini-chart-scroll\"><svg class=\"chart\" viewBox=\"0 0 840 205\"><defs><linearGradient id=\"socFillG\" x1=\"0\" x2=\"0\" y1=\"0\" y2=\"1\"><stop stop-color=\"#45ddaa\" stop-opacity=\".34\"/><stop offset=\"1\" stop-color=\"#45ddaa\" stop-opacity=\"0\"/><\/linearGradient><\/defs><g id=\"socAxes\" class=\"chart-axes\"><\/g><path id=\"socArea\" fill=\"url(#socFillG)\"/><path id=\"socChart\" fill=\"none\" stroke=\"#42e3ad\" stroke-width=\"2.4\"/><circle id=\"socDot\" r=\"4\" fill=\"#76ffd0\" opacity=\"0\"/><text id=\"socEmpty\" class=\"empty-chart\" x=\"185\" y=\"75\">Awaiting samples<\/text><\/svg><\/div><div class=\"plot-footer\"><span id=\"socStart\">--<\/span><span>LIVE<\/span><\/div><\/section>\n<section class=\"panel plot\"><div class=\"plot-head\"><div><strong>AC output<\/strong><div class=\"plot-val\" style=\"color:var(--blue)\" id=\"plotLoadVal\">-- W<\/div><\/div><span class=\"small-label\">TODAY \u00b7 ET<\/span><\/div><div class=\"mini-chart-scroll\"><svg class=\"chart\" viewBox=\"0 0 840 205\"><defs><linearGradient id=\"loadFillG\" x1=\"0\" x2=\"0\" y1=\"0\" y2=\"1\"><stop stop-color=\"#48b5ff\" stop-opacity=\".37\"/><stop offset=\"1\" stop-color=\"#48b5ff\" stop-opacity=\"0\"/><\/linearGradient><\/defs><g id=\"loadAxes\" class=\"chart-axes\"><\/g><path id=\"loadArea\" fill=\"url(#loadFillG)\"/><path id=\"loadChart\" fill=\"none\" stroke=\"#55c1ff\" stroke-width=\"2.4\"/><circle id=\"loadDot\" r=\"4\" fill=\"#81d6ff\" opacity=\"0\"/><text id=\"loadEmpty\" class=\"empty-chart\" x=\"185\" y=\"75\">Awaiting samples<\/text><\/svg><\/div><div class=\"plot-footer\"><span id=\"loadStart\">--<\/span><span>LIVE<\/span><\/div><\/section>\n<\/div>\n<\/div>\n<\/div><div class=\"asidepanels\">\n<section class=\"panel aside-block\"><div class=\"aside-title\"><span>\u2600<\/span> Solar yield & battery<\/div>\n<div class=\"total-row\"><span>Solar harvested today<\/span><strong id=\"energySolar\">--<\/strong><\/div>\n<div class=\"total-row\"><span>Solar harvested last 7 days<\/span><strong id=\"energySolarWeek\">--<\/strong><\/div>\n<div class=\"total-row\"><span>Battery voltage<\/span><strong id=\"batteryVQuick\">--<\/strong><\/div>\n<div class=\"total-row\"><span>Battery current<\/span><strong id=\"batteryAQuick\">--<\/strong><\/div>\n<div class=\"total-row\"><span>Estimated battery runtime<\/span><strong id=\"runtimeQuick\">--<\/strong><\/div>\n<div class=\"aside-grid\"><div class=\"tiny\"><div class=\"l\">DAYLIGHT DURATION<\/div><div class=\"v\" id=\"daylightQuick\">--<\/div><\/div><div class=\"tiny\"><div class=\"l\">SEASONAL PEAK SUN<\/div><div class=\"v\" id=\"peakSunQuick\">--<\/div><\/div><\/div>\n<\/section>\n<section class=\"panel aside-block\"><div class=\"aside-title\"><span style=\"color:var(--teal)\">\u25c8<\/span> MPPT fleet<\/div>\n<div id=\"mpptCards\" class=\"mppt-grid\"><div class=\"secondary\">Waiting for solar data<\/div><\/div>\n<div class=\"total-row\"><span>Victron connection<\/span><strong id=\"shuntState\">--<\/strong><\/div>\n<div class=\"total-row\"><span>AC source<\/span><strong id=\"acState\">--<\/strong><\/div>\n<div class=\"total-row\"><span>Selected control mode<\/span><strong id=\"controllerMode\">--<\/strong><\/div>\n<\/section><\/div><\/div>\n\n<div class=\"sectionhead\"><div><h2>Electrical diagnostics<\/h2><\/div><\/div>\n<div class=\"diag-grid\">\n<div class=\"panel diag\"><div class=\"diag-label\">Last full charge<\/div><div class=\"diag-value\" id=\"lastFullCharge\">--<\/div><div class=\"diag-sub\">Reported by Victron<\/div><\/div>\n<div class=\"panel diag\"><div class=\"diag-label\">Maximum SOC today<\/div><div class=\"diag-value\" id=\"todayMaxSoc\">--<\/div><div class=\"diag-sub\">Local Pi history<\/div><\/div>\n<div class=\"panel diag\"><div class=\"diag-label\">Lowest SOC \u2022 24h<\/div><div class=\"diag-value\" id=\"lowSoc24h\">--<\/div><div class=\"diag-sub\">Local Pi history<\/div><\/div>\n<div class=\"panel diag\"><div class=\"diag-label\">Runtime to cutoff<\/div><div class=\"diag-value\" id=\"runtimeToCutoff\">--<\/div><div class=\"diag-sub\" id=\"cutoffLabel\">Configured cutoff: --<\/div><\/div>\n<\/div>\n<\/section>\n<section id=\"analytics\" class=\"view view-content\"><div class=\"inner-header\"><div class=\"eyebrow\">ENGINEERING / LIVE TELEMETRY<\/div><h2>Analytics Lab<\/h2><\/div>\n<div class=\"explorer-layout\"><div><div class=\"panel mainplot\"><div class=\"headrow\"><div><div class=\"panel-title\" id=\"explorerTitle\">Solar production<\/div><\/div><span class=\"badge-state\" id=\"historyRangeBadge\">TODAY \u00b7 ET<\/span><\/div>\n<div class=\"chart-scroll\" id=\"chartScroll\"><svg id=\"explorerPlot\" class=\"chartwide\" viewBox=\"0 0 880 330\" role=\"img\" aria-label=\"Historical measurements. Drag or tap to inspect exact values.\"><defs><linearGradient id=\"explorerG\" x1=\"0\" x2=\"0\" y1=\"0\" y2=\"1\"><stop stop-color=\"#ffd064\" stop-opacity=\".28\"/><stop offset=\"1\" stop-color=\"#ffd064\" stop-opacity=\"0\"/><\/linearGradient><\/defs><g id=\"explorerGrid\"><\/g><path id=\"explorerFill\" fill=\"url(#explorerG)\"/><path id=\"explorerLine\" fill=\"none\" stroke=\"#ffd064\" stroke-width=\"3\"/><line id=\"explorerCrosshair\" x1=\"0\" x2=\"0\" y1=\"24\" y2=\"276\" stroke=\"#dbefff\" opacity=\"0\" stroke-dasharray=\"3 4\"/><circle id=\"explorerPoint\" r=\"5\" fill=\"white\" opacity=\"0\"/><rect id=\"plotHit\" x=\"40\" y=\"24\" width=\"796\" height=\"252\" fill=\"transparent\" tabindex=\"0\" aria-label=\"Inspect graph with arrow keys\"/><text id=\"explorerEmpty\" class=\"empty-chart\" x=\"440\" y=\"160\">Waiting for two valid samples<\/text><\/svg><\/div>\n<div class=\"chart-inspection\" id=\"plotHoverText\" role=\"status\" aria-live=\"off\">Select a point to inspect the reading<\/div><\/div>\n<\/div>\n<div class=\"panel form-card\"><div class=\"panel-title\">Chart configuration<\/div><label for=\"metricSelect\">MEASUREMENT<\/label><select id=\"metricSelect\"><option value=\"solar\">Solar production (W)<\/option><option value=\"soc\">Battery SOC (%)<\/option><option value=\"load\">AC output (W)<\/option><option value=\"grid\">Grid import (W)<\/option><option value=\"battery\">Battery power (W)<\/option><\/select>\n<label for=\"rangeSelect\">PERIOD<\/label><select id=\"rangeSelect\"><option value=\"today\" selected>Today \u00b7 12 AM\u201312 AM ET<\/option><option value=\"1h\">Last 1 hour<\/option><option value=\"6h\">Last 6 hours<\/option><option value=\"24h\">Last 24 hours<\/option><\/select>\n\n<button id=\"backOverview\" class=\"btn-outline\" style=\"width:100%;margin-top:16px\">Return to command center<\/button><\/div><\/div><\/section>\n<section id=\"systems\" class=\"view view-content\"><div class=\"inner-header\"><div class=\"eyebrow\">ENGINEERING / RELIABILITY<\/div><h2>Equipment & System Health<\/h2><\/div>\n<div class=\"grid-two\">\n<div class=\"panel syscard\"><h3>Battery bank \u2022 600Ah nominal<\/h3><p>Bank-level totals. Individual battery or cell statistics are not available on the current API.<\/p><div class=\"status-large\" id=\"healthSoc\">--<\/div><div id=\"batteryDetails\"><\/div><\/div>\n<div class=\"panel syscard\"><h3>AC input & inverter<\/h3><p>Live AC connection state, policy, current and grid-charging signal.<\/p><div id=\"acDetails\"><\/div><\/div>\n<div class=\"panel syscard\"><h3>Controller and communication<\/h3><div class=\"status-large\" id=\"controlHealth\">AWAITING DATA<\/div><div id=\"systemDetails\"><\/div><\/div>\n<div class=\"panel syscard\"><h3>Solar summary & sky reference<\/h3><p>Measured MPPT yield plus theoretical sunlight reference for the configured site (37663).<\/p><div id=\"solarDetails\"><\/div><\/div>\n<\/div>\n<div class=\"sectionhead\"><div><h2>Charge controller fleet<\/h2><p>Individual PV voltage, charging stage, DC current and instantaneous output<\/p><\/div><\/div><div class=\"panel panel-pad\" style=\"overflow-x:auto\"><table class=\"long-table\"><thead><tr><th>MPPT<\/th><th>STATE<\/th><th>OUTPUT (W)<\/th><th>DC CURRENT (A)<\/th><th>PV VOLTS<\/th><th>BATTERY VOLTS<\/th><th>ALL-TIME YIELD<\/th><\/tr><\/thead><tbody id=\"mpptTableBody\"><tr><td colspan=\"7\">Awaiting charge controllers<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"sectionhead\"><div><h2>Observed state transitions<\/h2><p>Events detected since page load, not the controller's durable event journal<\/p><\/div><\/div><div class=\"panel events\"><div id=\"healthEvents\"><div class=\"secondary\">No transitions recorded<\/div><\/div><\/div>\n<div id=\"error\" class=\"error-banner\" role=\"alert\" style=\"margin-top:15px\"><\/div><\/section>\n<footer class=\"footbar\"><span>\u2726 SOLAR FORTRESS / MISSION CONTROL \u00b7 <b>v0.2.8 / LIVE EDITION<\/b><\/span><span>BOOMER HQ \u2022 37663<\/span><\/footer>\n<\/main><\/div>\n<script>\n(() => {\n'use strict';\n// Solar Fortress Mission Control: READ-ONLY frontend. Never issues equipment commands.\nconst $ = (id) => document.getElementById(id);\nconst TZ = 'America/New_York';\nconst METRICS = {\n  solar: {label:'Solar generation', unit:'W', color:'#f6c56a'},\n  soc: {label:'Battery state of charge', unit:'%', color:'#48ddaf'},\n  load: {label:'AC output', unit:'W', color:'#68c5ff'},\n  grid: {label:'Grid import', unit:'W', color:'#cedff2'},\n  battery: {label:'Battery power', unit:'W', color:'#8ce4b1'}\n};\nlet view='overview', paused=false, sample=null, latestStamp=null, stampChangedAt=0;\nlet receivedAt=0, successfulAt=0, inFlight=false, history=[], lastSampleAt=0;\nlet historyRestored=false, historyRestoreError=null;\nlet observed={}, events=[], latestError='', renderStamp=0, solarGaugeScale=1000;\nconst num = (x) => x === null || x === undefined || x === '' ||\n  typeof x === 'boolean' || !Number.isFinite(Number(x)) ? null : Number(x);\nconst txt = (id, val) => {const e=$(id); if(e) e.textContent=String(val);};\nconst fmt = (n,places=0,suffix='') => {\n  const v=num(n); return v===null?'--':v.toLocaleString('en-US',{\n    minimumFractionDigits:places,maximumFractionDigits:places})+suffix;\n};\nconst fmtW=(n)=>fmt(n,0,' W');\nconst fmtKwh=(n)=>fmt(n,2,' kWh');\nconst yesno=(x)=>x===true?'YES':x===false?'NO':'--';\nconst dt=(ms,options)=>new Date(ms).toLocaleString('en-US',{timeZone:TZ,...options});\nfunction clock(){const now=Date.now();txt('dateDisplay',dt(now,{weekday:'short',month:'short',day:'numeric',year:'numeric'}).toUpperCase());txt('timeDisplay',dt(now,{hour:'numeric',minute:'2-digit',hour12:true}));}\nfunction duration(seconds){const n=num(seconds);if(n===null||n<0)return '--';\n const m=Math.floor(n/60),days=Math.floor(m/1440),hours=Math.floor(m%1440/60),mins=m%60;\n if(days)return `${days}d ${hours}h ago`;if(hours)return `${hours}h ${mins}m ago`;return `${mins}m ago`;\n}\nfunction setView(id){\n  view=id;document.querySelectorAll('.view').forEach(e=>e.classList.toggle('active',e.id===id));\n  document.querySelectorAll('[data-view]').forEach(b=>{const a=b.dataset.view===id;b.classList.toggle('active',a);b.setAttribute('aria-pressed',String(a));});\n  txt('viewTitle',id==='overview'?'Energy Command Center':id==='analytics'?'Live Analytics Lab':'System Health & Diagnostics');\n  if(id==='analytics'){explorerAutoScroll=true;renderExplorer();}\n}\nfunction setFlow(id,direction,power){\n const measured=num(power);\n // Only nonzero, classified, current power may energise a link.\n // 0, null, idle, and stale readings show only the stationary physical conductor.\n const active=direction!==0 && measured!==null && Math.abs(measured)>0;\n const v=active?Math.abs(measured):0;\n const speed=Math.max(.3,Math.min(1.7,1.6-v/1600)).toFixed(2)+'s';\n for(const suffix of ['', 'Mobile']){\n  const e=$('path'+id+suffix),wire=$('wire'+id+suffix);\n  if(e){\n    e.classList.toggle('off',!active);\n    // Every battery animation is authored battery -> DC bus (desktop and phone).\n    // Battery power < 0 = discharge, so run the default FORWARD animation.\n    // Battery power > 0 = charge, so REVERSE that animation toward the battery.\n    // Other paths keep their source -> destination direction convention.\n    const reverse = id==='Battery' ? direction>0 : direction<0;\n    e.classList.toggle('reverse',active&&reverse);\n    e.style.setProperty('--speed',speed);\n  }\n  if(wire)wire.classList.toggle('inactive',!active);\n }\n}\nfunction stopFlows(){for(const id of ['Pv','Dc','House','Grid','Battery'])setFlow(id,0,0);}\nfunction recordEvent(label,kind='info'){\n  if(events[0] && events[0].text===label && (Date.now()-events[0].t)<10000)return;\n  events.unshift({text:label,t:Date.now(),kind});events=events.slice(0,20);\n  const host=$('healthEvents');if(!host)return;host.replaceChildren();\n  for(const e of events){const row=document.createElement('div');row.className='logline';\n    const a=document.createElement('span');a.textContent=e.text;\n    if(e.kind==='bad')a.classList.add('red');\n    const b=document.createElement('span');b.textContent=dt(e.t,{hour:'numeric',minute:'2-digit',second:'2-digit'});\n    row.append(a,b);host.appendChild(row);\n  }\n}\nfunction monitorChange(key,value,label){if(value===null||value===undefined)return;\n if(Object.prototype.hasOwnProperty.call(observed,key)&&observed[key]!==value)recordEvent(`${label}: ${String(observed[key])} \u2192 ${String(value)}`);\n observed[key]=value;\n}\nfunction healthState(){\n  const now=Date.now();\n  const received=!!sample && receivedAt>0;\n  const transportAlive=received && now-receivedAt<12000;\n  const timestampAlive=received && latestStamp && now-stampChangedAt<15000;\n  const victronOk=sample?.victron_connected===true && !sample?.error;\n  const live=!!(transportAlive && timestampAlive && victronOk);\n  const controllerOk=sample?.controller_running===true;\n  return {live,transportAlive,timestampAlive,controllerOk,received,\n    solarOk:live && !sample?.solar_error && num(sample?.solar_power)!==null};\n}\nfunction renderHealth(h){\n  const pill=$('systemPill');pill.classList.remove('green','amber','warn');\n  const connected=h.live, ctrl=h.controllerOk;\n  const label=!h.received?'CONNECTING':!h.transportAlive?'API RETRYING':!h.timestampAlive?'READINGS DELAYED':!h.live?'VICTRON UNAVAILABLE':!ctrl?'CONTROLLER STOPPED':'LIVE TELEMETRY';\n  pill.classList.add(connected&&ctrl?'green':h.received?'warn':'amber');txt('systemPillText',label);\n  const age=h.received?Math.max(0,Math.floor((Date.now()-receivedAt)/1000)):null;\n  txt('sideStatus',connected?(ctrl?'Telemetry current':'Controller stopped'):'Last known readings shown');\n  txt('freshLabel',connected?'LIVE':'WAITING FOR FRESH DATA');\n  txt('lastUpdated',connected?'LIVE \u2022 '+age+'s SINCE RESPONSE':h.received?'LAST RESPONSE '+age+'s AGO':'AWAITING FIRST READING');\n  txt('latencyLabel',connected?'Polling every 1s \u2022 LIVE':'Polling every 1s \u2022 waiting for fresh measurements');\n  txt('controllerRunning',!h.received?'UNKNOWN':ctrl?'RUNNING':'STOPPED');\n  txt('victronState',!h.received?'UNKNOWN':sample?.victron_connected?'CONNECTED':'DISCONNECTED');\n  $('controlDot').className='dot '+(!h.received?'':ctrl?'good':'bad');\n  $('victronDot').className='dot '+(!h.received?'':sample?.victron_connected?'good':'bad');\n  $('flowPanel').classList.toggle('telemetry-degraded',!connected);\n  txt('controlHealth',!h.received?'AWAITING DATA':ctrl?'CONTROLLER RUNNING':'CONTROLLER STOPPED');\n  txt('shuntState',connected?'CONNECTED':h.received?'STALE':'--');\n  const errors=[sample?.error,sample?.solar_error,h.transportAlive?null:latestError].filter(Boolean);\n  const banner=$('error');if(banner){banner.classList.toggle('show',errors.length>0);banner.textContent=errors.join('\\n');}\n  if(!connected)stopFlows();\n}\nfunction labelAC(d){if(!d)return'--';const src=d.ac_present===true?'AC PRESENT':d.ac_present===false?'AC ABSENT':'AC UNKNOWN';\n const policy=d.ac_policy||'POLICY UNKNOWN';return `${src} \u00b7 ${policy}`;\n}\nfunction statusDescription(d){\n  if(d.grid_charging===true)return 'Grid charging active \u2022 AC accepted';\n  if(d.ac_connected===true && (num(d.ac_input_power)||0)>5)return 'Utility grid contributing to AC load';\n  if((num(d.solar_power)||0)>5 && String(d.battery_state).toUpperCase()==='CHARGING')return 'Solar harvesting \u2022 battery charging';\n  if(String(d.battery_state).toUpperCase()==='DISCHARGING')return 'Battery supplying DC energy';\n  if((num(d.solar_power)||0)>5)return 'Solar harvesting \u2022 DC bus active';\n  return String(d.mode||'System status unavailable').replaceAll('_',' ');\n}\n// Flow arrows are conservative indications, not independently metered inverter DC power.\n// Battery watts: positive = into bank, negative = out of bank (battery-monitor convention).\nfunction classifyFlows(d,h){\n const idle={pv:0,battery:0,dc:0,house:0,grid:0};\n if(!h?.live)return idle;\n const solar=num(d.solar_power),battery=num(d.battery_power),load=num(d.ac_output_power),grid=num(d.ac_input_power);\n const state=String(d.battery_state||'').toUpperCase();\n let batteryDirection=0;\n if(battery!==null && battery>8 && state==='CHARGING')batteryDirection=1;\n if(battery!==null && battery< -8 && state==='DISCHARGING')batteryDirection=-1;\n // Current on the positive DC conductor between the DC bus and MultiPlus\n // is not metered here. Net DC contribution is indicative, and cannot be\n // inferred if the MPPTs are unavailable or the inverter is idle.\n let dc=0;\n if(h.solarOk && solar!==null && battery!==null &&\n    (load!==null&&load>10 || d.grid_charging===true)){\n   const netToInverter=solar-battery;\n   if(netToInverter>35)dc=1;\n   else if(netToInverter< -35)dc=-1;\n }\n return {pv:h.solarOk&&solar!==null&&solar>5?1:0,\n   battery:batteryDirection,dc,\n   house:
